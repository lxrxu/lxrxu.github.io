<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>芭乐播放器</title>
    <style>
   
        .y1 {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #52b788, #b7e4c7, #ffddd2, #f8edeb);
            margin: 0;
        }

        .y2 {
            width: 350px;
            height: 350px;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.2);
        }

        .y3 {
            width: 220px;
            height: 160px;
            background: #fcfcfc;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .y4 {
            width: 200px;
            height: 140px;
            background: linear-gradient(135deg, #ffb4a2, #e5989b);
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .y5 {
            width: 80px;
            height: 80px;
            background: #fefffe;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .y6 {
            width: 0;
            height: 0;
            border-top: 18px solid transparent;
            border-bottom: 18px solid transparent;
            border-left: 30px solid #52b788;
        }
    </style>
</head>
<body>
    <!-- 全部用 y1~y6 嵌套，不用任何 body 样式 -->
    <div class="y1">
        <div class="y2">
            <div class="y3">
                <div class="y4">
                    <div class="y5" onclick="alert('播放！')">
                        <div class="y6"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
