<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .ys1{
            background-color: rgb(173, 243, 255);
            width: 400px;
            margin: 50px auto;
            border: 2px solid #ccc;
            
        }
        .bt{
            background-color: rgb(70, 202, 235);
            color: #000000;
            text-align: center;
            padding: 10px 0;
            font-size: large;
            letter-spacing: 6px;
            margin: 0;
            
        }
        .xbk{
            border: 5px solid snow;
        }
        .img{
            width: 20px;
            height: 20px;
            vertical-align: middle;
            margin-right: 6px;
        }
        .bt2{
            background: linear-gradient(to bottom, #a0e5f8,#f6f3f3);
            font-size: 16px;
            margin: 0;
            padding: 8px 10px; 
        }
        .bt2 img{
            width: 20px;
            height: 20px;
            float: left;
            margin-right: 8px;
            vertical-align: middle;
        }
       
        .bg{
            margin: 20px auto;
        }
        .bg td{
            padding: 8px;
        }
        .bg input{
            width: 180px;
            padding: 3px;
            border: 1px solid #bfbfbf;
        }
        .nn{
            text-align: center;
            padding-bottom: 20px;
        }
        .nn input{
            padding: 5px 100px;
            background-color: rgb(255, 253, 253);
            color: rgb(0, 0, 0);
            border: none;
            cursor: pointer;
        }
        .bg img{
            width: 20px;
            height: 20px;
            vertical-align: middle;
            margin-right: 6px;
            
        }
    </style>
</head>
<body>
    <div class="ys1">
        <div class="bt">
            网上书城
        </div>
        <div class="xbk">
        <div class="bt2">
            注册新用户
            <img src="./医疗十字架.png" alt="">
        </div>
        <form action="#" method="post">
            <table class="bg">
                <tr>
                    <td><img src="./用户 (1).png" alt="用户图标">用户名</td>
                    <td><input type="text" name="username"></td>
                </tr>
                <tr>
                    <td><img src="./密码 (2).png" alt="密码图标">密码</td>
                    <td><input type="text" name="password"></td>
                </tr>
                <tr>
                    <td><img src="./密匙.png" alt="确认密码图标">确认密码</td>
                    <td><input type="text" name="password"></td>
                </tr>
                <tr>
                    <td><img src="./邮箱 (1).png" alt="邮箱图标">电子邮件</td>
                    <td><input type="text" name="email"></td>
                </tr>
            </table>
            <div class="nn">
                <input type="submit" value="注册用户名">
            </div>
        </form>
        </div>
    </div>
</body>
</html>
